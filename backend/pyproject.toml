[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
# El esquema lo aplica tests/conftest.py desde docs/schema.sql (D-03), no las migraciones.
addopts = "--no-migrations"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
