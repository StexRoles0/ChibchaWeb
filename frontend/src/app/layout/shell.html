<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="barra">
  <button
    type="button"
    class="hamburguesa"
    aria-controls="menu-lateral"
    [attr.aria-expanded]="menuAbierto()"
    (click)="alternarMenu()"
  >
    <span class="solo-lector">Menú</span>
    <span aria-hidden="true">☰</span>
  </button>

  <a class="marca" routerLink="/" aria-label="ChibchaWEB, ir al inicio">
    <svg class="sol" viewBox="0 0 32 32" aria-hidden="true" width="28" height="28">
      <circle cx="16" cy="16" r="6" fill="currentColor" />
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path
          d="M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M26 6l-3.5 3.5M9.5 22.5L6 26"
        />
      </g>
    </svg>
    <span>Chibcha<b>WEB</b></span>
  </a>
  <span class="rol">{{ etiquetaRol() }}</span>

  <span class="espacio"></span>

  <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
  <span class="usuario">{{ nombre() }}</span>
  <button type="button" class="salir" (click)="cerrarSesion()">Cerrar sesión</button>
</header>

<div class="cuerpo">
  <nav id="menu-lateral" class="menu" [class.abierto]="menuAbierto()" aria-label="Menú principal">
    <p class="menu-titulo">MENÚ</p>
    <ul>
      @for (item of items(); track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: item.exacto ?? false }"
            ariaCurrentWhenActive="page"
            (click)="cerrarMenu()"
          >
            <span class="punto" aria-hidden="true"></span>{{ item.etiqueta }}
          </a>
        </li>
      }
    </ul>
    <p class="pie">ChibchaWEB · Sugamuxi<br />Soporte 24/7</p>
  </nav>

  <main id="contenido" class="contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>
